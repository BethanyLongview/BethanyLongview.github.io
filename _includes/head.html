<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

{%- assign page_desc = page.description | default: site.data.site.tagline -%}
<meta name="description" content="{{ page_desc }}">

<link rel="icon" type="image/png" href="{{ "/assets/images/favicon.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/images/favicon.png" | relative_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page_desc }}">
<meta property="og:image" content="{{ "/assets/images/social-card.jpg" | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{{ page_desc }}">
<meta name="twitter:image" content="{{ "/assets/images/social-card.jpg" | absolute_url }}">

<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Raleway:100,200,300,400,500,600,700,800,900" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Crimson+Text:400,400i" rel="stylesheet">

<link rel="stylesheet" href="{{ "/assets/css/open-iconic-bootstrap.min.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/animate.css" | relative_url }}">

<link rel="stylesheet" href="{{ "/assets/css/owl.carousel.min.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/owl.theme.default.min.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/magnific-popup.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/vendor/lightgallery/css/lightgallery-bundle.min.css" | relative_url }}">
<style>
  .lightgallery .gallery-tile { display: block; overflow: hidden; position: relative; cursor: pointer; }
  .lightgallery .gallery-tile img { width: 100%; height: 220px; object-fit: cover; transition: transform .45s ease, opacity .3s ease; }
  .lightgallery .gallery-tile:hover img { transform: scale(1.06); opacity: .9; }
  @media (max-width: 767.98px) { .lightgallery .gallery-tile img { height: 180px; } }

  /* Footer: drop the oversized 3rem left indent so widget links don't crowd/wrap */
  .ftco-footer .ml-md-5 { margin-left: 0 !important; }

  /* Homepage "Sunday Worship" intro band: cover the full width with a darker
     overlay so the right-column text stays readable over any photo */
  .ftco-intro .overlay { width: 100% !important; opacity: .65 !important; background: #02475a !important; }
  .ftco-intro, .ftco-intro p, .ftco-intro h2 { color: #fff; }

  /* Tighten the expanded (dropdown) nav on desktop so all items stay within
     the dark hero — otherwise lower links spill onto white content unreadably */
  @media (min-width: 992px) {
    .ftco-navbar-light .navbar-nav > .nav-item > .nav-link { padding-top: .12rem; padding-bottom: .12rem; line-height: 1.2; }
    .ftco-navbar-light .navbar-nav > .nav-item .dropdown-menu { padding-top: .1rem; padding-bottom: .1rem; }
    .ftco-navbar-light .navbar-nav > .nav-item .dropdown-menu .dropdown-item { padding-top: .15rem; padding-bottom: .15rem; }
  }

  /* Inline PDF.js newsletter viewer */
  .pdf-viewer .pdf-pages { max-width: 1000px; margin: 0 auto; }
  .pdf-viewer .pdf-page-canvas { display: block; width: 100%; height: auto; margin: 0 auto 1.25rem; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
</style>

<link rel="stylesheet" href="{{ "/assets/css/aos.css" | relative_url }}">

<link rel="stylesheet" href="{{ "/assets/css/ionicons.min.css" | relative_url }}">

<link rel="stylesheet" href="{{ "/assets/css/bootstrap-datepicker.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/jquery.timepicker.css" | relative_url }}">

<link rel="stylesheet" href="{{ "/assets/css/flaticon.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/icomoon.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
