# Decap CMS configuration for Bethany Lutheran Church
#
# Auth: GitHub OAuth via a Cloudflare Worker proxy.
# Set base_url to the Worker URL once the proxy is deployed.
# Until then, set `local_backend: true` and run `npx decap-server` for local testing.
#
# Permissions: anyone with write access to the GitHub repo can edit. Manage
# Ginger / Pastor Susan / Beth via repo collaborators (or a GitHub team).
# Decap does not enforce per-collection RBAC; if review-before-publish is wanted
# later, enable `publish_mode: editorial_workflow` to route changes through PRs.

backend:
  name: github
  repo: BethanyLongview/BethanyLongview.github.io
  branch: main
  base_url: https://decap-oauth-bethany.workers.dev  # TODO: replace with deployed Worker URL
  auth_endpoint: auth

# Uncomment for local development with `npx decap-server`:
# local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://bethanylongview.org
display_url: https://bethanylongview.org
logo_url: /assets/img/logo.png

collections:
  # ---------------------------------------------------------------------------
  # Site-wide settings (single file, edited as a form)
  # ---------------------------------------------------------------------------
  - name: settings
    label: "Site Settings"
    files:
      - name: site
        label: "Site"
        file: "_data/site.yml"
        fields:
          - { name: church_name, label: "Church name", widget: string }
          - { name: tagline, label: "Tagline", widget: string, required: false }
          - { name: mission, label: "Mission statement", widget: text, required: false }
          - { name: vision, label: "Vision statement", widget: text, required: false }
          - { name: contact_email, label: "Office email", widget: string }
          - { name: pastor_email, label: "Pastor's email", widget: string, required: false }
          - { name: phone, label: "Phone", widget: string, required: false }
          - { name: address, label: "Address", widget: text, required: false }
          - { name: office_hours, label: "Office hours", widget: string, required: false }
          - { name: service_time, label: "Sunday service time", widget: string, required: false, hint: "e.g. 'Sundays at 9:30 a.m.'" }
          - name: current_liturgical_season
            label: "Current liturgical season"
            widget: select
            options:
              - { label: "Advent (purple/blue)", value: advent }
              - { label: "Christmas (white/gold)", value: christmas }
              - { label: "Epiphany (white/green)", value: epiphany }
              - { label: "Lent (purple)", value: lent }
              - { label: "Easter (white/gold)", value: easter }
              - { label: "Pentecost (red)", value: pentecost }
              - { label: "Ordinary Time (green)", value: ordinary }
            default: ordinary
            hint: "Pastor Susan: change this to retheme the Events & Activities page."
          - name: giving_url
            label: "Online giving (VanCo) URL"
            widget: string
            required: false
            hint: "Full VanCo link for recurring + one-time donations."
          - name: youtube_playlist_url
            label: "Sermon YouTube playlist URL"
            widget: string
            required: false
            hint: "Full URL to the sermon archive playlist."
          # Structural fields — rarely edited, but kept here so they round-trip.
          - { name: denomination, label: "Denomination", widget: string, required: false }
          - { name: synod, label: "Synod", widget: string, required: false }
          - { name: synod_url, label: "Synod URL", widget: string, required: false }
          - { name: conference, label: "Conference", widget: string, required: false }

  # ---------------------------------------------------------------------------
  # Static / migrated content pages
  # ---------------------------------------------------------------------------
  - name: pages
    label: "Pages"
    label_singular: "Page"
    folder: "_pages"
    create: false                    # Lock the page list to the ones we migrate
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: permalink, label: "Permalink", widget: string, hint: "URL path, e.g. /about/" }
      - { name: order, label: "Nav order", widget: number, required: false, value_type: int }
      - name: banner
        label: "Banner image"
        widget: image
        required: false
      - { name: body, label: "Body", widget: markdown }

  # ---------------------------------------------------------------------------
  # Monthly newsletters (PDF uploads, auto-archived by Jekyll collection)
  # ---------------------------------------------------------------------------
  - name: newsletters
    label: "Newsletters"
    label_singular: "Newsletter"
    folder: "_newsletters"
    create: true
    slug: "{{year}}-{{month}}"
    summary: "{{title}} — {{date}}"
    sort: "date:desc"
    fields:
      - { name: title, label: "Title", widget: string, hint: "e.g. June 2026 Newsletter" }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: pdf, label: "PDF file", widget: file, media_library: { config: { multiple: false } } }
      - { name: summary, label: "Short summary", widget: text, required: false }

  # ---------------------------------------------------------------------------
  # Weekly announcements / bulletin
  # ---------------------------------------------------------------------------
  - name: announcements
    label: "Weekly Announcements"
    label_singular: "Announcement"
    folder: "_announcements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    summary: "{{date}} — {{title}}"
    sort: "date:desc"
    fields:
      - { name: title, label: "Title", widget: string, default: "Weekly Announcements" }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: pdf, label: "PDF file", widget: file, required: false }
      - { name: body, label: "Body (optional)", widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # Sermon archive (YouTube links)
  # ---------------------------------------------------------------------------
  - name: sermons
    label: "Sermons"
    label_singular: "Sermon"
    folder: "_sermons"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} — {{title}}"
    sort: "date:desc"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: preacher, label: "Preacher", widget: string, default: "Pastor Susan" }
      - { name: scripture, label: "Scripture reading", widget: string, required: false }
      - { name: youtube_url, label: "YouTube URL", widget: string }
      - { name: notes, label: "Notes", widget: markdown, required: false }

  # ---------------------------------------------------------------------------
  # Volunteer opportunities (Beth + Ginger)
  # ---------------------------------------------------------------------------
  - name: volunteer
    label: "Volunteer Opportunities"
    label_singular: "Opportunity"
    folder: "_volunteer"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Description", widget: markdown }
      - { name: contact, label: "Contact person", widget: string, required: false }
      - { name: signup_url, label: "Sign-up URL / form link", widget: string, required: false }
      - { name: active, label: "Active", widget: boolean, default: true }

  # ---------------------------------------------------------------------------
  # Photo gallery / slideshow (single ordered list in a data file)
  # ---------------------------------------------------------------------------
  - name: gallery
    label: "Photo Gallery"
    files:
      - name: photos
        label: "Photos"
        file: "_data/gallery.yml"
        fields:
          - name: photos
            label: "Photos"
            widget: list
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: "Image", widget: image }
              - { name: caption, label: "Caption", widget: string, required: false }
              - { name: credit, label: "Photo credit", widget: string, required: false }

  # ---------------------------------------------------------------------------
  # Prayer list — DEFERRED
  # Pastor Susan + Beth need to decide: public Decap-managed list vs.
  # submit-only form forwarding to staff email. Until that's settled, do not
  # add a collection here. See bethany_stakeholders memory for context.
  # ---------------------------------------------------------------------------
