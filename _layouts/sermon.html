---
layout: default
---
<article class="sermon">
  <h1>{{ page.title }}</h1>
  <p class="date">{{ page.date | date: "%B %-d, %Y" }} &middot; {{ page.preacher }}</p>
  {% if page.scripture %}<p><em>{{ page.scripture }}</em></p>{% endif %}
  {% if page.youtube_url %}
    <p><a href="{{ page.youtube_url }}">Watch on YouTube</a></p>
  {% endif %}
  {{ content }}
</article>
