---
layout: default
---
<article class="prayer-page">
  <h1>{{ page.title }}</h1>
  {{ content }}

  <form action="https://formspree.io/f/mdajazwe"
        method="POST"
        class="prayer-form">

    <p>
      <label>
        Your name <span class="optional">(optional)</span>
        <input type="text" name="name" autocomplete="name">
      </label>
    </p>

    <p>
      <label>
        Your email <span class="optional">(optional — only if you'd like a response)</span>
        <input type="email" name="email" autocomplete="email">
      </label>
    </p>

    <p>
      <label>
        Prayer request
        <textarea name="message" rows="6" required></textarea>
      </label>
    </p>

    {%- comment -%}
      Honeypot — visually hidden text input that real users won't see and
      bots tend to fill in. Filled submissions are silently dropped by
      Formspree and do not count against the monthly quota.
    {%- endcomment -%}
    <div class="hp" aria-hidden="true" style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;">
      <label>
        Leave this field blank
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
      </label>
    </div>

    <input type="hidden" name="_subject" value="Prayer request via bethanylongview.org">

    <p>
      <button type="submit">Submit prayer request</button>
    </p>
  </form>
</article>
